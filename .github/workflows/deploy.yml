name: Deploy to EC2 via SSH

on:
  push:
    branches:
      - feature/deployment-pipeline

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup SSH Key
        run: |
          # Create the .ssh directory if it doesn't exist
          mkdir -p ~/.ssh/
          
          # Write the private key from the secret into a file
          echo "${{ secrets.EC2_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          
          # Set the required, strict file permissions
          chmod 600 ~/.ssh/id_rsa

      - name: 3. Connect and Deploy to EC2
        run: |
          # Connect to the EC2 instance and run the deployment script.
          # The -o StrictHostKeyChecking=no is important to prevent an interactive prompt.
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} '
            # --- Start of commands to run ON THE EC2 INSTANCE ---
            echo "--- Connected to EC2 instance ---"
            
            # Navigate to the project directory
            cd /home/ubuntu/Nexus-pm
            
            # Pull the latest code from your feature branch
            echo "--- Pulling latest code ---"
            git pull origin feature/deployment-pipeline
            
            # Create the .env file from GitHub Secrets for Docker Compose
            echo "--- Creating .env file ---"
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" > .env
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
            echo "DATABASE_URL_PROD=${{ secrets.DATABASE_URL_PROD }}" >> .env
            
            # Configure AWS credentials for DVC
            export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            
            # Pull the latest model/data using DVC
            echo "--- Pulling DVC data ---"
            /home/ubuntu/.local/bin/dvc pull
            
            # Re-build and deploy the application with Docker Compose
            echo "--- Deploying with Docker Compose ---"
            docker-compose down
            docker-compose build
            docker-compose up -d
            
            echo "--- Deployment complete ---"
            # --- End of commands to run ON THE EC2 INSTANCE ---
            '
