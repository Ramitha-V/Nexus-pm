name: Deploy Nexus PM to EC2 via SSH

on:
  push:
    branches:
      - feature/deployment-pipeline

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout the repository
        uses: actions/checkout@v4

      - name: 2. SSH and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            # Navigate to the project directory on the EC2 instance
            cd /home/ubuntu/Nexus-pm
            
            # Pull the latest code from the master branch
            git pull origin master
            
            # Create the .env file from GitHub Secrets for Docker Compose
            # This securely passes your keys to the application
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
            echo "DATABASE_URL_PROD=${{ secrets.DATABASE_URL_PROD }}" >> .env
            
            # Configure AWS credentials for DVC
            export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            
            # Pull the latest model/data using DVC
            /home/ubuntu/.local/bin/dvc pull
            
            # Re-build and deploy the application with Docker Compose
            docker-compose down
            docker-compose build
            docker-compose up -d
