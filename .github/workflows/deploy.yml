name: Deploy Nexus PM to EC2

on:
  push:
    branches:
      - feature/deployment-pipeline # Trigger deployment on this branch

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest # Use a standard GitHub-hosted runner

    steps:
      - name: 1. Checkout repository
        # Gets the code from your repository onto the runner
        # This isn't strictly needed if pulling on EC2, but good practice
        uses: actions/checkout@v4

      - name: 2. Deploy via SSH using appleboy action
        # Uses the community action to handle SSH connection
        uses: appleboy/ssh-action@master
        with:
          # Use the correct secret names from your repository
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }} # Use the key secret you created

          # The script block contains commands to run ON THE EC2 INSTANCE
          script: |
            echo "--- Connected to EC2 instance ---"

            # Navigate to the project directory
            cd /home/ubuntu/Nexus-pm

            # Pull the latest code from your feature branch
            echo "--- Pulling latest code ---"
            git pull origin feature/deployment-pipeline

            # Create the .env file from GitHub Secrets for Docker Compose
            echo "--- Creating .env file ---"
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
            echo "DATABASE_URL_PROD=${{ secrets.DATABASE_URL_PROD }}" >> .env

            # Configure AWS credentials for DVC (needed for the next step)
            export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}

            # Pull the latest model/data using DVC
            echo "--- Pulling DVC data ---"
            /home/ubuntu/.local/bin/dvc pull

            # Re-build and deploy the application with Docker Compose
            echo "--- Deploying with Docker Compose ---"
            docker-compose down
            docker-compose build
            docker-compose up -d

            echo "--- Deployment complete ---"
